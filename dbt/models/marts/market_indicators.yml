version: 2

models:
  - name: market_indicators
    description: Indicadores de mercado do Banco Central prontos para consumo analítico.

    columns:
      - name: series_id
        description: Código da série no Banco Central.
        data_tests:
          - not_null

      - name: series_name
        description: Nome do indicador.
        data_tests:
          - not_null

      - name: observation_date
        description: Data da observação.
        data_tests:
          - not_null

      - name: value
        description: Valor observado.
        data_tests:
          - not_null

      - name: unit
        description: Unidade de medida.
        data_tests:
          - not_null