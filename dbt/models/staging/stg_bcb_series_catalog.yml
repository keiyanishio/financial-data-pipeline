version: 2

models:
  - name: stg_bcb_series_catalog
    description: Catálogo padronizado das séries temporais do Banco Central.

    columns:
      - name: series_id
        description: Código da série no sistema SGS.
        data_tests:
          - not_null
          - unique

      - name: series_name
        description: Nome da série.
        data_tests:
          - not_null

      - name: unit
        description: Unidade de medida da série.
        data_tests:
          - not_null

      - name: frequency
        description: Frequência de atualização da série.
        data_tests:
          - not_null

      - name: source
        description: Sistema público de origem.
        data_tests:
          - not_null

      - name: is_active
        description: Indica se a série está ativa no pipeline.
        data_tests:
          - not_null